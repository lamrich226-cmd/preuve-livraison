<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2238">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Preuve">
<title>Preuve de livraison</title>
<script src="jspdf.umd.min.js"></script>
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Kufi";src:url(fonts/kufi-arabic.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF}
:root{
  --bar:#0D2238; --bar-ink:#FFFFFF; --bar-soft:rgba(255,255,255,.68); --bar-line:rgba(255,255,255,.18);
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F4F7FA; --ink:#0D2238; --ink-2:#51657A; --line:#D7DFE7;
  --accent:#F2A900; --accent-ink:#241A00; --accent-soft:#FDF1D2;
  --ok:#14804A; --ok-soft:#E1F3E8; --bad:#C0362C; --bad-soft:#FBE7E5;
  --font:"Archivo","Kufi",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(13,34,56,.06),0 4px 14px rgba(13,34,56,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bar:#0D2238; --bg:#08131E; --surface:#112131; --surface-2:#172A3C; --ink:#E7EEF5; --ink-2:#93A7BA; --line:#22374B;
  --accent:#FFB81C; --accent-ink:#241A00; --accent-soft:#3A2E0E;
  --ok:#3DC67E; --ok-soft:#123526; --bad:#FF6B5E; --bad-soft:#3A1B1A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,label:focus-within,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.h{font-stretch:72%;font-weight:800;letter-spacing:-.005em;line-height:1.02}
[dir=rtl] .h{font-stretch:100%;font-weight:700}

/* ---------- barre du haut (toujours là) ---------- */
.appbar{position:sticky;top:0;z-index:8;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;min-height:58px}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;position:relative;flex:none}
.ib:active{background:var(--bar-line)}
.badge{position:absolute;top:3px;inset-inline-end:2px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--bar)}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
.who .nm{font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none;text-transform:uppercase}
.rolet{font-size:.7rem;font-weight:700;color:var(--bar-soft);border:1px solid var(--bar-line);border-radius:6px;padding:1px 6px;flex:none}
.langb{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--bar-line);font-weight:700;font-size:.85rem;flex:none}
.langmenu{position:fixed;top:62px;inset-inline-end:12px;z-index:45;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.22);overflow:hidden;min-width:200px}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:start;padding:14px 16px;font-weight:600}
.langmenu button + button{border-top:1px solid var(--line)}
.langmenu button.on{background:var(--surface-2)}
.langmenu small{font-weight:800;color:var(--ink-2)}

/* ---------- en-tête bleu de chaque écran ---------- */
.hero{background:var(--bar);color:var(--bar-ink);padding:6px 20px 46px}
.hero .in{max-width:560px;margin:0 auto}
.hero h1{margin:0;font-size:2.35rem}
.hero p{margin:6px 0 0;color:var(--bar-soft)}
.sheet{max-width:560px;margin:-30px auto 0;padding:0 14px 24px;position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:1.3rem}

/* ---------- connexion ---------- */
.login-hero{text-align:center;padding:26px 20px 64px}
svg.i.stamp{width:104px;height:104px;color:var(--accent);display:block;margin:0 auto 14px;stroke-linecap:round;stroke-linejoin:round}
.login-hero h1{font-size:2.6rem}
.field{margin-top:14px}
.field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:7px}
.inp{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;color:var(--ink-2)}
.inp:focus-within{border-color:var(--ink);outline:none}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;padding:14px 0;outline:none}
.inp .eye{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:12px 0 4px;font-size:.93rem}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:14px;padding:16px;font-weight:800;font-size:1.06rem}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-2{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:700;padding:14px}
.btn-quiet{color:var(--ink-2);font-weight:700;padding:12px}
.btn:active:not(:disabled){transform:translateY(1px)}

/* ---------- tours ---------- */
.tours{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 14px;text-align:start;box-shadow:var(--shadow);min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .tn{font-size:1.45rem}
.tile .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.tile.cur{background:var(--bar);color:#fff;border-color:var(--bar)}
.tile.cur .ti{background:var(--accent);color:var(--accent-ink)}

/* ---------- admin ---------- */
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.acct{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.acct:first-child{border-top:0}
.acct .av{background:var(--surface-2);color:var(--ink)}
.acct .tx{flex:1;min-width:0}
.acct .u{font-weight:700}
.acct .pw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;color:var(--ink-2)}
.chip-role{font-size:.7rem;font-weight:800;background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:2px 7px;margin-inline-start:6px}
.del{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--bad);background:var(--bad-soft)}

/* ---------- écran livraison ---------- */
.tourline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tourline small{display:block;color:var(--bar-soft);font-weight:600;font-size:.85rem;margin-bottom:2px}
.tourline .tname{font-size:2.5rem}
.pillbtn{display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;background:var(--bar-line);font-weight:700;font-size:.88rem;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--bar-line);color:var(--bar-ink);font-size:.82rem;font-weight:600}
.pill svg.i{width:16px;height:16px}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--bar-soft)}
.pill.ok .d{background:#4ADE80} .pill.bad .d{background:#FF7B6E}
.prog{display:flex;gap:5px;margin-top:16px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--bar-line)}
.prog i.on{background:var(--accent)}
.lab{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.req{color:var(--bad)}
.ocr{font-size:.85rem;color:var(--ink-2);margin-top:8px;min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--surface-2);border:1px solid var(--line);padding:7px 12px;font-size:.9rem;border-radius:999px;text-align:start;font-weight:600}
.cat{padding:14px}
.cat-h{display:flex;align-items:center;gap:12px}
.cat-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink);flex:none;position:relative}
.cat.done .cat-ic{background:var(--ok-soft);color:var(--ok)}
.cat-ic .ck{position:absolute;bottom:-4px;inset-inline-end:-4px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.cat-ic .ck svg.i{width:12px;height:12px;stroke-width:3.2}
.cat-t{flex:1;min-width:0}
.cat-n{font-weight:800;font-size:1.06rem}
.cat-s{font-size:.84rem;color:var(--ink-2)}
.cat-s.req{color:var(--bad);font-weight:600}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:12px -2px 0;padding:2px 2px 4px;scrollbar-width:none}
.thumbs:empty{display:none}
.th{flex:none;width:84px;height:84px;padding:0;overflow:hidden;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.acts{display:grid;grid-template-columns:1.35fr 1fr;gap:8px;margin-top:12px}
.acts label{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;font-weight:700;font-size:.95rem;border-radius:12px;cursor:pointer;position:relative;text-align:center}
.a-cam{background:var(--bar);color:#fff}
@media (prefers-color-scheme:dark){.a-cam{background:var(--accent);color:var(--accent-ink)}}
.a-gal{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));margin-top:6px}
.dock .in{max-width:532px;margin:0 auto}
.dock .note{font-size:.85rem;color:var(--ink-2);text-align:center;margin:0 0 8px;min-height:1.2em}
.reset{display:block;margin:2px auto 0}

/* ---------- visionneuse ---------- */
.lb{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb-bar{display:flex;gap:8px;align-items:center;padding:12px 14px;color:#fff;background:#0b0b0b}
.lb-bar span{flex:1;font-weight:700}
.lb-bar button{display:flex;align-items:center;gap:6px;padding:11px 14px;border-radius:12px;font-weight:700}
.lb-del{color:#FF8A80;background:rgba(255,138,128,.12)}
.lb-close{background:#fff;color:#000}

/* ---------- tiroir ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(5,12,20,.5)}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:31;width:min(88vw,400px);background:var(--bg);box-shadow:6px 0 30px rgba(0,0,0,.28);transform:translateX(-102%);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
[dir=rtl] .drawer{left:auto;right:0;transform:translateX(102%)}
[dir=rtl] .drawer.open{transform:translateX(0)}
@media (prefers-reduced-motion:no-preference){.drawer{transition:transform .24s cubic-bezier(.2,.8,.2,1)}}
.dr-h{background:var(--bar);color:#fff;padding:16px 16px 18px}
.dr-top{display:flex;align-items:center;justify-content:space-between}
.dr-top strong{font-size:1.7rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bar-line);border-radius:12px;padding:4px;margin-top:14px}
.seg button{padding:10px 6px;border-radius:9px;font-weight:700;color:var(--bar-soft)}
.seg button.on{background:#fff;color:var(--bar)}
.dr-list{flex:1;overflow-y:auto;padding:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.item .row{display:flex;align-items:flex-start;gap:12px}
.item .st{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--ink)}
.item.sent .st{background:var(--ok-soft);color:var(--ok)}
.item .n{font-weight:800}
.item .m{font-size:.84rem;color:var(--ink-2)}
.tag{display:inline-block;font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:6px;background:var(--surface-2);color:var(--ink-2)}
.item .b{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.item .b button{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:11px;font-weight:700;font-size:.88rem;background:var(--surface-2);border:1px solid var(--line)}
.item .b .go{background:var(--bar);color:#fff;border-color:var(--bar)}
@media (prefers-color-scheme:dark){.item .b .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}}
.item .b .x{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.item .b svg.i{width:17px;height:17px}
.empty{color:var(--ink-2);text-align:center;padding:40px 16px}
.empty svg{width:64px;height:64px;color:var(--line);display:block;margin:0 auto 10px}
.dr-foot{padding:12px 14px 16px;display:grid;gap:6px;border-top:1px solid var(--line)}

/* ---------- bienvenue + confirmation ---------- */
.over{position:fixed;inset:0;z-index:60;background:var(--bar);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:28px}
.over svg.i.stamp{width:132px;height:132px;margin-bottom:18px}
.over .s1{font-size:1.2rem;color:var(--bar-soft)}
.over .s2{font-size:2.9rem;word-break:break-word;max-width:100%}
.over .s3{color:var(--accent);font-weight:700;margin-top:6px;min-height:1.4em}
.over.okc .stamp{color:#4ADE80}
.over .btn{max-width:320px;margin-top:26px}
@media (prefers-reduced-motion:no-preference){
  .over .stamp{animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) both}
  .over .s1{animation:up .45s .15s ease-out both}
  .over .s2{animation:up .45s .22s ease-out both}
  .over .s3,.over .btn{animation:up .45s .3s ease-out both}
  .over.out{transition:opacity .3s ease-in;opacity:0}
}
@keyframes stampIn{from{opacity:0;transform:scale(1.6) rotate(14deg)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.toast{position:fixed;left:14px;right:14px;bottom:18px;max-width:532px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:14px;font-weight:600;display:none;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{display:block}
.busy{pointer-events:none}
.busy .sheet,.busy .dock{opacity:.6}
svg.logo{width:116px;height:116px;color:var(--accent);display:block;margin:0 auto 10px}
.over svg.logo{width:140px;height:140px;margin-bottom:14px}
.inp textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1rem;line-height:1.45;padding:12px 0;outline:none;resize:vertical;min-height:88px}
.cat-name{width:100%;border:0;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:800;font-size:1.06rem;padding:2px 0 3px;outline:none}
.cat-name:focus{border-bottom-color:var(--accent)}
.catdel{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--bad);background:var(--bad-soft);flex:none}
.addfree{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:var(--r);border:2px dashed var(--line);color:var(--ink-2);font-weight:700;margin:0 0 12px}
.addfree:active{background:var(--surface-2)}
.opt{font-weight:500;color:var(--ink-2);font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>

/* ---------- Serveur des comptes (Supabase) ---------- */
async function sbRpc(fn, body){
  if(!SB_URL || !SB_KEY) throw new Error("NOCONF");
  const h={"apikey":SB_KEY,"Content-Type":"application/json"};
  if(!SB_KEY.startsWith("sb_")) h["Authorization"]="Bearer "+SB_KEY;
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:h,body:JSON.stringify(body)});
  const txt=await r.text(); let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){}
  if(!r.ok){ const e=new Error((data&&data.message)||txt||("Erreur "+r.status)); e.server=true; throw e; }
  return data;
}
async function sha(x){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x)); return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join(""); }

async function doLogin(){
  const u=$("lu").value.trim(), p=$("lp").value, err=m=>{$("lErr").textContent=m;};
  if(!u||!p){ err(t("errEmpty")); return; }
  err(""); busy(true);
  const key="pl_cred_"+u.toLowerCase(), h=await sha(u.toLowerCase()+"|"+p);
  let role=null;
  try{
    role=await sbRpc("pl_login",{p_user:u,p_pass:p});
    if(role) lsSet(key,{h,role}); else lsDel(key);
  }catch(e){
    if(e.message==="NOCONF"){ busy(false); err(t("errNoConf")); return; }
    if(e.server){ busy(false); err(t("errServer")+srvMsg(e.message)); return; }
    const c=lsGet(key);
    if(c && c.h===h) role=c.role; else { busy(false); err(t("errOffline")); return; }
  }
  busy(false);
  if(!role){ err(t("errWrong")); return; }
  me={user:u, key:u.toLowerCase(), role, pass:p};
  lsSet("pl_session",me);
  $("lp").value="";
  startSession();
}
function startSession(){
  tour=lsGet("pl_tour_"+me.key); if(!TOURS.includes(tour)) tour=null;
  if(me.role==="admin") openAdmin(); else afterLogin();
  welcome();
}
async function checkSession(){            // compte supprimé ou mot de passe changé → retour à la connexion
  if(!me || !navigator.onLine) return;
  try{ const role=await sbRpc("pl_login",{p_user:me.user,p_pass:me.pass});
    if(!role){ endSession(); $("lErr").textContent=t("sessionEnded"); }
    else if(role!==me.role){ me.role=role; lsSet("pl_session",me); renderWho(); }
  }catch(e){}
}

/* ---------- GPS + adresse ---------- */
function getPos(){
  return new Promise(res=>{
    if(!navigator.geolocation){ setGps(false); res(null); return; }
    navigator.geolocation.getCurrentPosition(p=>{ lastPos=p; setGps(true); res(p); }, ()=>{ setGps(!!lastPos); res(lastPos); },
      {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
  });
}
function startWatch(){ if(navigator.geolocation && !window._watch) window._watch=navigator.geolocation.watchPosition(p=>{lastPos=p;setGps(true)},()=>{if(!lastPos)setGps(false)},{enableHighAccuracy:true,maximumAge:30000}); }
function setGps(ok){ gpsState=ok; renderGps(); }
function renderGps(){
  $("gpsPill").className="pill"+(gpsState===null?"":(gpsState?" ok":" bad"));
  $("gpsTxt").textContent = gpsState===null ? t("gpsSearch") : (gpsState && lastPos ? t("gpsOn",{m:Math.round(lastPos.coords.accuracy)}) : t("gpsOff"));
}
function quickPos(){
  if(lastPos && Date.now()-lastPos.timestamp<60000) return Promise.resolve(lastPos);
  return Promise.race([getPos(), new Promise(r=>setTimeout(()=>r(lastPos),6000))]);
}
const addrCbs={};
window.onAddress=function(id,txt){ const cb=addrCbs[id]; if(cb){ delete addrCbs[id]; cb(txt||null); } };
function getAddress(pos){
  if(!pos || !A || !A.reverseGeocode || !navigator.onLine) return Promise.resolve(null);
  return new Promise(res=>{ const id="a"+Date.now()+Math.floor(Math.random()*1e6); addrCbs[id]=res;
    setTimeout(()=>{ if(addrCbs[id]){ delete addrCbs[id]; res(null); } },8000);
    A.reverseGeocode(id, pos.coords.latitude, pos.coords.longitude); });
}

function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function handleFiles(c, files){

          lat: pos?pos.coords.latitude:null, lon: pos?pos.coords.longitude:null } };

// Horodatage sur la photo, style « Timestamp Camera » : texte blanc ombré, sans bandeau
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function shrink(p){
  const im=p.raw, MAX=1600, k=Math.min(1,MAX/Math.max(im.naturalWidth,im.naturalHeight));
  const w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const g=cv.getContext("2d");
  g.drawImage(im,0,0,w,h);
  const d=p.meta.date ? new Date(p.meta.date) : new Date();
  const U=Math.min(w,h)/100;                       // unité proportionnelle à la photo
  const big=U*9.5, mid=U*3.6, small=U*3.1, pad=U*4, F="Archivo, Roboto, Arial, sans-serif";
  g.textBaseline="alphabetic"; g.direction="ltr"; g.lineJoin="round";
  const txt=(s,x,y,font,color)=>{ g.font=font;
    g.shadowColor="rgba(0,0,0,.75)"; g.shadowBlur=U*1.2; g.shadowOffsetX=0; g.shadowOffsetY=U*0.25;
    g.strokeStyle="rgba(0,0,0,.45)"; g.lineWidth=Math.max(1.5,U*0.35); g.strokeText(s,x,y);
    g.shadowColor="transparent"; g.fillStyle=color||"#fff"; g.fillText(s,x,y); };
  // lignes du bas (de bas en haut)
  const lines=[];
  lines.push(`Tour ${tour}  •  ${me.user}`);
  if(p.meta.gps) lines.push(`GPS ${p.meta.lat.toFixed(6)}, ${p.meta.lon.toFixed(6)}  ±${Math.round(p.meta.acc||0)} m`); else lines.push("GPS non disponible");
  if(p.meta.addr){ const parts=p.meta.addr.split(", "); for(let i=parts.length-1;i>=0;i--) lines.push(parts[i]); }
  let y=h-pad;
  lines.forEach((l,i)=>{ txt(l,pad,y,`${i===0?600:500} ${i<2?small:mid}px ${F}`, i===0?"rgba(255,255,255,.9)":"#fff"); y-=(i<2?small:mid)*1.45; });
  // heure en grand + barre jaune + date / jour
  y-=U*1.5;
  const hm=`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  g.font=`800 ${big}px ${F}`; const tw=g.measureText(hm).width;
  txt(hm,pad,y,`800 ${big}px ${F}`);
  const bx=pad+tw+U*2.2;
  g.shadowColor="rgba(0,0,0,.6)"; g.shadowBlur=U; g.fillStyle="#F2A900"; g.fillRect(bx,y-big*0.74,U*0.9,big*0.78); g.shadowColor="transparent";
  txt(`${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`,bx+U*2.5,y-big*0.42,`700 ${mid}px ${F}`);
  txt(JOURS[d.getDay()],bx+U*2.5,y,`500 ${mid}px ${F}`);
  p.img=cv.toDataURL("image/jpeg",0.82); p.w=w; p.h=h;
}
function pad2(n){ return String(n).padStart(2,"0"); }

/* ---------- OCR : nom du client ---------- */
const CLIENT_KEYS=/^(client|klant|naam|nom|destinataire|livr[ée] à|leveradres|afleveradres|leveren aan|deliver to|ship to)(?=[\s:.\-]|$)\s*[:.\-]?\s*(.*)$/i;
const HEADER_WORDS=/leveringsnota|levdatum|klant|bonnr|\bblz\b|omschrijving|\bcode\b|pr\.?\s?(in|ex)\b|waarde|factuur|bestel|datum|totaal|btw|\bbest\b|\bover\b|\blev\b|hoev|verpakking|verdeellijst|lotnummer|artikelcode|lactose|gluten|\btel\b|e-?mail|bakkerij|mechelen|via gps|kanaaldijk|schoten/i;
const ADDRESS=/\b\d{4}\s+[A-Za-zÀ-ÿ]|straat|laan|plein|\blei\b|\bweg\b|\brue\b|avenue|^B-\d{4}/i;
const CUST_CODE=/\s*\bBE\s?[0-9O]{5,7}\b.*$/i;
function cleanName(x){
  x=x.replace(CUST_CODE,"").replace(/\(\s*\d+\s*\)\s*$/,"").replace(/^verdeelgroep\s*\d*\s*[-–:]\s*/i,"").trim();
  if(x===x.toUpperCase() && /[A-Z]/.test(x)) x=x.toLowerCase().replace(/(^|[\s.\-'])([a-zà-ÿ])/g,(m,p1,p2)=>p1+p2.toUpperCase());
  return x;
}
function runOcr(p){
  if(!(A && A.ocrImage)){ setOcr("typeClient"); return; }
  setOcr("ocrReading"); $("chips").innerHTML="";
  const im=p.raw, MAX=2000, k=Math.min(1,MAX/Math.max(im.naturalWidth,im.naturalHeight));
  const cv=document.createElement("canvas"); cv.width=Math.round(im.naturalWidth*k); cv.height=Math.round(im.naturalHeight*k);
  cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
  A.ocrImage(cv.toDataURL("image/jpeg",0.9).split(",")[1]);
}
window.onOcrResult=function(items){
  items=(items||[]).map(x=>typeof x==="string"?{t:x,top:0,h:0}:x).map(x=>({t:String(x.t||"").trim(),top:+x.top||0,h:+x.h||0})).filter(x=>x.t);
  if(!items.length){ setOcr("ocrNone"); return; }
  items.sort((x,y)=>x.top-y.top); items.forEach(it=>{ it.c=cleanName(it.t); });
  const wordy=x=>{ const w=x.split(/\s+/).filter(Boolean); const L=w.map(v=>v.replace(/[^A-Za-zÀ-ÿ]/g,"").length); return Math.max(0,...L)>=4 && L.reduce((a,b)=>a+b,0)/w.length>=2.6; };
  const ok=it=>it.c.length>=3 && (it.c.match(/[A-Za-zÀ-ÿ]/g)||[]).length>=3 && wordy(it.c) && !HEADER_WORDS.test(it.c) && !ADDRESS.test(it.c) && !/\d{3,}/.test(it.c);
  let guess="";
  for(const it of items){ if(/verdeelgroep/i.test(it.t) && ok(it)){ guess=it.c; break; } }
  if(!guess) for(const it of items){ if(/\bBE\s?[0-9O]{5,7}\b/i.test(it.t) && !/\d\.\d{3}\.\d{3}/.test(it.t) && ok(it)){ guess=it.c; break; } }
  if(!guess) for(const it of items){ const m=it.t.match(CLIENT_KEYS); if(m && m[2] && m[2].trim().length>1 && !HEADER_WORDS.test(m[2]) && !/^\d+$/.test(m[2].trim())){ guess=cleanName(m[2]); break; } }
  const cands=items.filter(ok);
  if(!guess && cands.length){
    const minT=items[0].top, span=Math.max(1,items[items.length-1].top-minT); let best=null, bs=-1;
    cands.forEach(it=>{ let sc=it.h; if((it.top-minT)/span<0.4) sc*=1.4; if(sc>bs){bs=sc; best=it;} });
    if(best) guess=best.c;
  }
  const input=$("client"); if(guess) input.value=guess;
  setOcr(guess?"ocrFound":"ocrPick");
  const box=$("chips"); box.innerHTML=""; const seen=new Set();
  cands.slice().sort((x,y)=>y.h-x.h).filter(it=>it.c.length<=45 && !seen.has(it.c) && seen.add(it.c)).slice(0,12).forEach(it=>{
    const b=el("button","chip",it.c); b.type="button"; b.dir="auto"; b.onclick=()=>{ input.value=it.c; updateSend(); }; box.appendChild(b); });
  updateSend();
};
window.onOcrError=function(){ setOcr("ocrFail"); };

function buildPdf(){
  const { jsPDF } = window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const now=new Date(), client=clientName(), all=allPhotos();
  const NAVY=[13,34,56], AMBER=[242,169,0], GREY=[81,101,122];
  doc.setProperties({title:`Preuve de livraison – ${client}`});
  // en-tête
  doc.setFillColor(...NAVY); doc.rect(0,0,210,44,"F");
  doc.setFillColor(...AMBER); doc.rect(0,44,210,2.2,"F");
  doc.setTextColor(255); doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.text("PREUVE DE LIVRAISON",15,15);
  doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.text(doc.splitTextToSize(client,170)[0],15,28);
  doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.text(`Tour ${tour}  •  ${fmtDate(now)}`,15,37);
  // infos
  doc.setTextColor(0); let y=60;
  [["Client",client],["Tour",tour],["Chauffeur",me.user],["Date",fmtDate(now)],["Photos",String(all.length)]].forEach(([k,v])=>{
    doc.setFont("helvetica","normal"); doc.setTextColor(...GREY); doc.setFontSize(10); doc.text(k,15,y);
    doc.setFont("helvetica","bold"); doc.setTextColor(0); doc.setFontSize(12); doc.text(String(v),55,y); y+=9; });
  const obs=obsText();
  if(obs){
    doc.setFont("helvetica","normal"); doc.setTextColor(...GREY); doc.setFontSize(10); doc.text("Observations",15,y);
    doc.setTextColor(0); doc.setFontSize(11.5); const L=doc.splitTextToSize(obs,140);
    const hh=L.length*5.6+6; doc.setFillColor(253,241,210); doc.roundedRect(53,y-5,142,hh,2,2,"F");
    doc.text(L,56,y); y+=hh+3;
  }
  y+=4; doc.setDrawColor(215,223,231); doc.line(15,y,195,y); y+=9;
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("Photos",15,y); y+=8;
  doc.setFontSize(10);
  const items=[]; cats().forEach(c=>photos[c.key].forEach(p=>items.push({c,p,label:docLabel(c,p)})));
  items.forEach(({p,label})=>{
    if(y>282){ doc.addPage(); y=20; }
    doc.setFont("helvetica","bold"); doc.text(doc.splitTextToSize(label,52)[0],15,y);
    doc.setFont("helvetica","normal"); doc.setTextColor(...GREY);
    const L=doc.splitTextToSize(`${p.meta.when}${p.meta.addr?"  •  "+p.meta.addr:""}`,125); doc.text(L,70,y); doc.setTextColor(0);
    y+=5*L.length+3; });
  // pages photo : un cadre en haut avec les infos, la photo en dessous sans rien dessus
  items.forEach(({p,label},i)=>{
    doc.addPage();
    doc.setDrawColor(...NAVY); doc.setLineWidth(0.5); doc.roundedRect(15,10,180,25,2.5,2.5,"S");
    doc.setFillColor(...AMBER); doc.rect(19,14.5,1.6,16,"F");
    doc.setTextColor(...NAVY); doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(doc.splitTextToSize(label,130)[0],24,18);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...GREY); doc.text(`${i+1} / ${items.length}`,191,18,{align:"right"});
    doc.setTextColor(0); doc.setFontSize(9.5);
    doc.text(doc.splitTextToSize(`${p.meta.when}  •  Tour ${tour}  •  ${me.user}  •  ${p.meta.addr||"Adresse non disponible"}`,166)[0],24,24.5);
    doc.setTextColor(...GREY); doc.text(p.meta.gps?"GPS "+p.meta.gps:"GPS non disponible",24,30);
    if(p.meta.lat!=null){ doc.setTextColor(181,121,0); doc.textWithLink("Voir sur la carte",191-doc.getTextWidth("Voir sur la carte"),30,{url:`https://maps.google.com/?q=${p.meta.lat},${p.meta.lon}`}); }
    doc.setTextColor(0);
    const top=41, maxW=180, maxH=297-top-10, r=Math.min(maxW/p.w,maxH/p.h), iw=p.w*r, ih=p.h*r;
    doc.addImage(p.img,"JPEG",15+(maxW-iw)/2,top,iw,ih);
  });
  const st=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  return {
    b64: doc.output("datauristring").split(",")[1],

    client, tour, photos: all.length
  };
}

/* ---------- Stockage : brouillons + envoyés ---------- */
const DB={db:null,
  open(){ return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{ const r=indexedDB.open("photolivraison",2);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("drafts")) d.createObjectStore("drafts",{keyPath:"id"}); if(!d.objectStoreNames.contains("sent")) d.createObjectStore("sent",{keyPath:"id"}); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  async tx(store,mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const x=db.transaction(store,mode); const q=fn(x.objectStore(store)); x.oncomplete=()=>res(q?q.result:undefined); x.onerror=()=>rej(x.error); }); },
  all(s){ return this.tx(s,"readonly",st=>st.getAll()); },
  put(s,d){ return this.tx(s,"readwrite",st=>st.put(d)); },
  del(s,id){ return this.tx(s,"readwrite",st=>st.delete(id)); }
};
const newId=()=>String(Date.now())+Math.floor(Math.random()*1000);

  if(!navigator.onLine){ toast(t("retryLater")); return; }
  sending={kind:"draft", d, onlyAuto}; autoAll=all; busy(true); toast(t("sendingC",{c:d.client}),120000);
  A.sendPdfMail(d.b64,d.filename,d.subject,d.body);
}
async function sendAllDrafts(onlyAuto){
  if(sending || !me || !navigator.onLine || !canMail()) return;
  const list=(await mine("drafts")).filter(d=>!onlyAuto || d.auto).reverse();
  if(list.length) sendDraft(list[0], true, onlyAuto);
}

/* ---------- Tiroir latéral ---------- */
function openDrawer(){ $("scrim").hidden=false; $("drawer").classList.add("open"); $("drawer").setAttribute("aria-hidden","false"); refreshDrawer(); }
function closeDrawer(){ $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden","true"); $("scrim").hidden=true; }
function drawerOpen(){ return $("drawer").classList.contains("open"); }
function setTab(x){ drTab=x; $("tabDr").classList.toggle("on",x==="dr"); $("tabOut").classList.toggle("on",x==="out"); refreshDrawer(); }
function btnI(cls,icon,text,fn){ const b=el("button",cls); b.appendChild(ico(icon)); b.appendChild(el("span",null,text)); b.onclick=fn; return b; }
async function refreshDrawer(){
  const {d,s}=await refreshCounts(); const box=$("drList"); box.innerHTML="";
  $("drSendAll").hidden = !(drTab==="dr" && d.length);
  const list = drTab==="dr" ? d : s;
  if(!list.length){ const e=el("div","empty"); e.appendChild(ico(drTab==="dr"?"i-inbox":"i-send")); e.appendChild(el("div",null, drTab==="dr" ? t("noDrafts") : t("noSent"))); box.appendChild(e); return; }
  list.forEach(x=>{
    const it=el("div","item"+(drTab==="out"?" sent":""));
    const row=el("div","row"); const st=el("div","st"); st.appendChild(ico(drTab==="dr"?"i-clock":"i-check",20));
    const tx=el("div"); tx.style.minWidth="0";
    const n=el("div","n",x.client); n.dir="auto";
    const when = drTab==="dr" ? t("created",{d:x.created}) : t("sentOn",{d:x.sentAt});
    tx.append(n, el("div","m",`${t("tourOf",{t:x.tour})} • ${plN(x.photos)}`), el("div","m",when));
    if(drTab==="dr") tx.appendChild(el("span","tag", x.copy ? t("tagCopy") : t("tagAuto")));
    row.append(st,tx); it.appendChild(row);
    const b=el("div","b");
    if(drTab==="dr"){
      b.append(btnI("go","i-send",t("sendBtn"),()=>sendDraft(x,false,false)),
               btnI("","i-file",t("openPdf"),()=>openPdf(x)),
               btnI("x","i-trash",t("delete"),async()=>{ if(confirm(t("confirmDelDraft",{c:x.client}))){ await DB.del("drafts",x.id); refreshDrawer(); } }));
    } else {
      b.append(btnI("go","i-copy",t("copy"),async()=>{ await saveDraft(x,false); toast(t("copied")); setTab("dr"); }),
               btnI("","i-file",t("openPdf"),()=>openPdf(x)));
    }
    it.appendChild(b); box.appendChild(it);
  });
}
function openPdf(x){ if(A && A.openPdf) A.openPdf(x.b64,x.filename); else toast(t("openNA")); }
$("btnMenu").onclick=openDrawer; $("drClose").onclick=closeDrawer; $("scrim").onclick=closeDrawer;
$("tabDr").onclick=()=>setTab("dr"); $("tabOut").onclick=()=>setTab("out");
$("drSendAll").onclick=()=>sendAllDrafts(false);
$("drLogout").onclick=logout;
let tx0=null, ty0=null;
document.addEventListener("touchstart",e=>{ const x=e.touches[0]; tx0=x.clientX; ty0=x.clientY; },{passive:true});
document.addEventListener("touchend",e=>{
  if(tx0==null) return; const x=e.changedTouches[0], dy=Math.abs(x.clientY-ty0);
  const rtl=document.documentElement.dir==="rtl", W=window.innerWidth;
  const dx=rtl ? (tx0-x.clientX) : (x.clientX-tx0);
  const fromEdge=rtl ? (W-tx0)<30 : tx0<30;
  if(!$("sMain").hidden && $("lb").hidden && dy<60){
    if(!drawerOpen() && fromEdge && dx>70) openDrawer();
    else if(drawerOpen() && dx<-70) closeDrawer();
  }
  tx0=null;
},{passive:true});

/* ---------- Réseau ---------- */
window.addEventListener("online",()=>{ if(me){ toast(t("netBack")); checkSession(); setTimeout(()=>sendAllDrafts(true),2000); } });
window.addEventListener("offline",()=>{ if(me) toast(t("netGone")); });
setInterval(()=>{ if(me) sendAllDrafts(true); },180000);

/* ---------- Bouton retour Android ---------- */
window.onBack=function(){
  if(!$("over").hidden){ $("over").click(); return true; }
  if(!$("langMenu").hidden){ $("langMenu").hidden=true; return true; }
  if(!$("lb").hidden){ closeLb(); return true; }
  if(drawerOpen()){ closeDrawer(); return true; }
  if(!$("sTour").hidden && tour){ openMain(); return true; }
  return false;
};

/* ---------- Démarrage : reprend la session enregistrée ---------- */
resetDelivery();
applyLang();
if(!window.Android && "serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
(function boot(){
  const s=lsGet("pl_session");
  if(s && s.user && s.role && s.pass){ me=s; startSession(); setTimeout(checkSession,1200); }
})();
</script>
